name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # playwright is a devDependency for scripts/screenshots.js only, and its postinstall would pull
  # ~150MB of browser engines on every run. Nothing in CI drives a browser - the syntax check
  # parses that script with `node --check` rather than executing it - so the download is skipped.
  # Anyone actually taking screenshots runs `npx playwright install chromium` once, locally.
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t opendockwatch:ci .
