<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>OpenDockWatch — login</title>
    <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
    <link rel="stylesheet" href="/assets/style.css" />
  </head>
  <body class="login-body">
    <form id="login-form" class="login-card">
      <h1>
        <img src="/assets/logo.svg" alt="" class="brand-logo" /><span class="brand-name"
          ><span class="brand-open">Open</span><span class="brand-dock">Dock</span><span class="brand-watch">Watch</span></span
        >
      </h1>
      <label>
        Username
        <input type="text" name="username" autocomplete="username" required autofocus />
      </label>
      <label>
        Password
        <input type="password" name="password" autocomplete="current-password" required />
      </label>
      <button type="submit">Sign in</button>
      <p id="login-error" class="error" hidden>Invalid credentials</p>
    </form>

    <script src="/assets/js/login.js"></script>
  </body>
</html>
